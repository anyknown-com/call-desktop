[package]
name = "voice-providers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HTTP providers for the voice desktop app: ElevenLabs STT/TTS, OpenAI chat+TTS, Anthropic chat"

[dependencies]
voice-core.workspace = true
tokio.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
futures.workspace = true
async-trait = "0.1"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "multipart", "stream"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }

[dev-dependencies]
wiremock = "0.6"
