[workspace]
resolver = "2"
members = [
  "crates/voice-core",
  "crates/voice-providers",
  "crates/voice-ml",
  "crates/voice-os",
  "crates/voice-audio",
  "crates/voice-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/anyknown-com/voice-desktop"

[workspace.dependencies]
voice-core = { path = "crates/voice-core" }
voice-providers = { path = "crates/voice-providers" }
voice-ml = { path = "crates/voice-ml" }
voice-os = { path = "crates/voice-os" }
voice-audio = { path = "crates/voice-audio" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
hound = "3.5"
